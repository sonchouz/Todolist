plugins {
    id 'java'
    id 'application'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '8.3.11'
}

group = 'org.example'

version = '0.2.0'

sourceCompatibility = '21'
targetCompatibility = '21'

application {
    mainClass = 'org.example.TodoApp'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

shadowJar {
    archiveBaseName.set('todo-app')
    archiveClassifier.set('')
    archiveVersion.set(project.version.toString())

    mergeServiceFiles()
}

tasks.jar {
    enabled = false
}

tasks.named('distZip') {
    dependsOn tasks.named('shadowJar')
}

tasks.named('distTar') {
    dependsOn tasks.named('shadowJar')
}

tasks.build {
    dependsOn shadowJar
}
tasks.named('run', JavaExec) {
    standardInput = System.in
}
tasks.named('test', Test) {
    doFirst {
        println "TEST CLASSES DIRS: ${sourceSets.test.output.classesDirs.asPath}"
        println "TEST RUNTIME CLASSPATH:"
        println classpath.asPath
        println "TEST CLASS EXISTS: ${file('build/classes/java/test/org/example/TodoListTest.class').exists()}"
    }
}
publishing {

    publications {

        mavenJava(MavenPublication) {

            groupId = project.group
            artifactId = 'todo-app'
            version = project.version.toString()

            artifact(tasks.shadowJar)
        }
    }

    repositories {

        maven {

            name = "GitHubPackages"

            url = uri(
                "https://maven.pkg.github.com/sonchouz/Todolist"
            )

            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
}